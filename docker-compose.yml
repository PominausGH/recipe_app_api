services:
  app:
    build:
      context: .
      args:
      - DEV=true
    ports:
    - 127.0.0.1:8001:8000
    volumes:
    - ./app:/app
    command: "sh -c \"python manage.py wait_for_db &&\n      python manage.py migrate &&\n      python manage.py runserver\
      \ 0.0.0.0:8000\"\n"
    env_file:
    - .env
    restart: unless-stopped
    networks:
    - default
    - postgres-main-network
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    security_opt:
    - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 200
volumes: {}
networks:
  postgres-main-network:
    external: true
